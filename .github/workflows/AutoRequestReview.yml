name: Auto Request Review

on:
    pull_request_target:
        types: [opened, reopened]

jobs:
    auto-request-review:
        name: Auto Request Review
        runs-on: ubuntu-latest
        steps:
            - name: Request review based on set criteria
              uses: necojackarc/auto-request-review@v0.7.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config: .github/workflows/config/AutoRequestReviewConfig.yml
