name: Feature Branch Bulletin

on:
    workflow_dispatch:
    schedule:
        - cron: '0 6 * * 1-5'

jobs:
    compile-feature-branch-bulletin:
        runs-on: ubuntu-latest
        steps:
            - name: Setup bulletin information
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - run: |
                  chmod +x feature_branch_bulletin_setup.sh
                  ./feature_branch_bulletin_setup.sh
              working-directory: ./.github/workflows/FeatureBranchBulletin
            - name: Checkout repository wiki
              uses: actions/checkout@v3
              with:
                  repository: '${{ github.repository }}.wiki'
                  path: 'wiki'
            - name: Update bulletin report
              run: |
                  chmod +x feature_branch_bulletin_report.sh
                  ./feature_branch_bulletin_report.sh
              working-directory: ./.github/workflows/FeatureBranchBulletin
