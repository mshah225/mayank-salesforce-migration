name: Metadata Sync

on:
    workflow_dispatch:
    push:
        branches:
            - sync

jobs:
    metadata-sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  ref: main
                  fetch-depth: 0
            - name: Run Git operations
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin
                  git pull --no-edit origin sync
            - name: Create pull request
              uses: peter-evans/create-pull-request@v5
              with:
                  commit-message: 'Automatic metadata sync from Enterprise Salesforce to GitHub'
                  title: 'GITHUB-ACTIONS[BOT]: METADATA SYNC'
                  body: "Comparison is the fastest way to feel unhappy. Luckily, I'm not human, so I'm immune to your biological ailments."
                  reviewers: mgilardi, jdsanch8, rnordmanASU
                  branch: prod
                  delete-branch: true
