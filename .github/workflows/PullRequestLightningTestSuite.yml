name: Pull Request Lightning Test Suite

on:
    pull_request:
        types: [opened, ready_for_review, reopened, edited]
        branches:
            - 'dev'
            - 'qa'
            - 'uat'
            - 'wpc'
            - 'migration-**'
            - '**Migration**'
            - 'main'

jobs:
    lightning-test-suite:
        name: Lightning Test Suite
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - name: Install npm
              run: |
                  npm install
            - name: Run LWC test suite
              run: |
                  npm run test:unit
