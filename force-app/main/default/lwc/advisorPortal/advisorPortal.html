<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <c-lightning-design-toast></c-lightning-design-toast>

    <div>
        <div class="slds-text-align_right slds-var-m-bottom_x-small">
            <c-advisor-portal-feedback-button onshowtoast={handleToast}></c-advisor-portal-feedback-button>
        </div>
    </div>

    <div class="slds-grid slds-wrap slds-gutters_direct-x-small slds-var-m-bottom_x-small">
        <div class="slds-col slds-max-large-size_1-of-1">
            <div class="slds-card slds-var-p-around_small light-blue-background">
                <c-advisor-portal-user-select
                    onchangeusers={changeSelectedUsers}
                    onloading={handleLoading}
                ></c-advisor-portal-user-select>
            </div>
        </div>
        <div class="slds-col slds-shrink-none slds-grow-none slds-max-large-size_1-of-1">
            <div class="slds-grid slds-grid_vertical">
                <div class="slds-col slds-size_1-of-1 slds-var-m-bottom_x-small">
                    <div class="slds-card slds-var-p-around_small">
                        <c-advisor-portal-filter-select-career
                            onchange={updateFilter}
                            default-filter={defaultFilter}
                        ></c-advisor-portal-filter-select-career>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-var-m-bottom_x-small">
                    <div class="slds-card slds-var-p-around_small">
                        <c-advisor-portal-save-filters
                            current-filter={currentFilter}
                            onsetdefaultfilter={setDefaultFilter}
                            onloading={handleLoading}
                            onshowtoast={handleToast}
                        ></c-advisor-portal-save-filters>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="slds-grid slds-wrap slds-gutters_direct-x-small slds-var-m-bottom_x-small">
        <div class="slds-col">
            <div class="slds-card slds-var-p-around_small">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-grow-none slds-max-large-size_1-of-1">
                        <c-advisor-portal-filter-select-type
                            onchange={updateFilter}
                            default-filter={defaultFilter}
                        ></c-advisor-portal-filter-select-type>
                    </div>
                    <div class="slds-col slds-grow slds-max-large-size_1-of-1"></div>
                    <div class="slds-col slds-max-medium-size_1-of-1">
                        <!-- sldsValidatorIgnoreNextLine -->
                        <fieldset>
                            <!-- sldsValidatorIgnoreNextLine -->
                            <legend class="slds-form-element__legend slds-form-element__label">Mass Actions</legend>
                            <div class="slds-form-element__control">
                                <lightning-button label="Mass Transfer" variant="brand" class="mr-2"></lightning-button>
                                <lightning-button
                                    label="Mass Email"
                                    onclick={openModalMassEmail}
                                    variant="brand"
                                    class="mr-2"
                                ></lightning-button>
                                <lightning-button label="Mass Close" variant="brand" class="mr-2"></lightning-button>
                                <!-- sldsValidatorIgnoreNextLine -->
                                <lightning-button-icon
                                    icon-name="utility:refresh"
                                    variant="brand"
                                    alternative-text="Refresh"
                                    size="medium"
                                    title="Refresh"
                                    onclick={refresh}
                                ></lightning-button-icon>
                            </div>
                        </fieldset>
                    </div>
                    <div class="slds-col slds-grow-none slds-max-medium-size_1-of-1 advanced-filter-button">
                        <lightning-button label="Advanced Filters" variant="brand"></lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="slds-grid slds-wrap slds-gutters_direct-x-small slds-var-m-bottom_x-small">
        <div class="slds-col">
            <div class="slds-card slds-var-p-around_small">
                <c-advisor-portal-filter-section
                    onchange={updateFilter}
                    onsetresults={updateResults}
                    view-as-users={selectedUsers}
                    current-filter={currentFilter}
                    default-filter={defaultFilter}
                    onloading={handleLoading}
                ></c-advisor-portal-filter-section>
            </div>
        </div>
    </div>

    <div class="slds-grid slds-wrap slds-gutters_direct-x-small slds-var-m-bottom_x-small">
        <div class="slds-col">
            <div class="slds-card slds-var-p-around_small">
                <c-advisor-portal-table
                    all-results={allResults}
                    onnavigate={navigate}
                    onsetselected={updateSelectedResults}
                    onloading={handleLoading}
                ></c-advisor-portal-table>
            </div>
        </div>
    </div>

    <c-advisor-portal-modal-mass-email
        selected-contact-wrappers={selectedResults}
        onloading={handleLoading}
        onshowtoast={handleToast}
    ></c-advisor-portal-modal-mass-email>
</template>
