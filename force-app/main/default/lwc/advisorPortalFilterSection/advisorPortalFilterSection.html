<template>
    <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
            <lightning-input
                label="Student"
                type="text"
                name="studentString"
                onchange={changeField}
                value={currentFilter.studentString}
                required="true"
            ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
            <c-lightning-combo-box-multi-select
                label="Campus"
                options={campusPicklistValues}
                name="campus"
                onchange={changeField}
                value={currentFilter.campus}
            ></c-lightning-combo-box-multi-select>
        </div>

        <template if:true={isGraduateOnly}>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Degree Level"
                    options={degreeLevelOptions}
                    name="degreeLevel"
                    onchange={changeField}
                    value={currentFilter.degreeLevel}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Academic Program"
                    options={academicProgramOptions}
                    name="academicProgram"
                    onchange={changeField}
                    value={currentFilter.academicProgram}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="School/Department"
                    options={schoolDepartmentOptions}
                    name="schoolDepartment"
                    onchange={changeField}
                    value={currentFilter.schoolDepartment}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Academic Plan"
                    options={academicPlanOptions}
                    name="academicPlan"
                    onchange={changeField}
                    value={currentFilter.academicPlan}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <fieldset class="slds-form-element slds-form-element_compound">
                    <label class="slds-form-element__label">Admit Term</label>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__row">
                            <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                                <lightning-input
                                    type="text"
                                    label="From"
                                    name="admitTermFrom"
                                    onchange={changeField}
                                    value={currentFilter.admitTermFrom}
                                ></lightning-input>
                            </div>
                            <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                                <lightning-input
                                    type="text"
                                    label="To"
                                    name="admitTermTo"
                                    onchange={changeField}
                                    value={currentFilter.admitTermTo}
                                ></lightning-input>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </template>
        <template if:false={isGraduateOnly}>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Academic Level"
                    options={academicLevelPicklistValues}
                    name="academicLevel"
                    onchange={changeField}
                    value={currentFilter.academicLevel}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <lightning-input
                    type="text"
                    label="Student Group"
                    name="studentGroupCode"
                    onchange={changeField}
                    value={currentFilter.studentGroupCode}
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <lightning-input
                    type="text"
                    label="Major"
                    name="major"
                    onchange={changeField}
                    value={currentFilter.major}
                ></lightning-input>
            </div>
        </template>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
            <c-lightning-combo-box-multi-select
                label="Residency"
                options={residencyPicklistValues}
                name="residency"
                onchange={changeField}
                value={currentFilter.residency}
            ></c-lightning-combo-box-multi-select>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
            <c-lightning-combo-box-multi-select
                label="Case Status"
                options={caseStatusPicklistValues}
                name="caseStatus"
                onchange={changeField}
                value={currentFilter.caseStatus}
            ></c-lightning-combo-box-multi-select>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
            <c-lightning-combo-box-multi-select
                label="Case Category"
                options={caseCategoryPicklistValues}
                name="caseCategory"
                onchange={changeField}
                value={currentFilter.caseCategory}
            ></c-lightning-combo-box-multi-select>
        </div>

        <template if:true={isGraduateOnly}>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Special Population"
                    options={specialPopulationOptions}
                    name="specialPopulation"
                    onchange={changeField}
                    value={currentFilter.specialPopulation}
                ></c-lightning-combo-box-multi-select>
            </div>
        </template>
        <template if:false={isGraduateOnly}>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Case Subject"
                    options={caseSubjectPicklistValues}
                    name="caseSubject"
                    onchange={changeField}
                    value={currentFilter.caseSubject}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Outlook Score"
                    options={outlookScoreOptions}
                    name="outlookScore"
                    onchange={changeField}
                    value={currentFilter.outlookScore}
                ></c-lightning-combo-box-multi-select>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
                <c-lightning-combo-box-multi-select
                    label="Outlook Change"
                    options={outlookChangeOptions}
                    name="outlookChange"
                    onchange={changeField}
                    value={currentFilter.outlookChange}
                ></c-lightning-combo-box-multi-select>
            </div>
        </template>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-large-size_1-of-5">
            <lightning-input
                type="text"
                label="Case Count"
                name="caseCount"
                onchange={changeField}
                value={currentFilter.caseCount}
            ></lightning-input>
        </div>
    </div>
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-3">
            <fieldset class="slds-form-element slds-form-element_compound">
                <label class="slds-form-element__label">Created Date</label>
                <div class="slds-form-element__control">
                    <div class="slds-form-element__row">
                        <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                            <lightning-input
                                type="date"
                                label="From"
                                name="createdFromDate"
                                onchange={changeField}
                                value={currentFilter.createdFromDate}
                            ></lightning-input>
                        </div>
                        <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                            <lightning-input
                                type="date"
                                label="To"
                                name="createdToDate"
                                onchange={changeField}
                                value={currentFilter.createdToDate}
                            ></lightning-input>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="slds-col slds-size_1-of-3">
            <fieldset class="slds-form-element slds-form-element_compound">
                <label class="slds-form-element__label">Follow Up Date</label>
                <div class="slds-form-element__control">
                    <div class="slds-form-element__row">
                        <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                            <lightning-input
                                type="date"
                                label="From"
                                name="followUpFromDate"
                                onchange={changeField}
                                value={currentFilter.followUpFromDate}
                            ></lightning-input>
                        </div>
                        <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                            <lightning-input
                                type="date"
                                label="To"
                                name="followUpToDate"
                                onchange={changeField}
                                value={currentFilter.followUpToDate}
                            ></lightning-input>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
        <template if:false={isGraduateOnly}>
            <div class="slds-col slds-size_1-of-3">
                <fieldset class="slds-form-element slds-form-element_compound">
                    <label class="slds-form-element__label">Persistence Change Date</label>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__row">
                            <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                                <lightning-input
                                    type="date"
                                    label="From"
                                    name="persistenceFromDate"
                                    onchange={changeField}
                                    value={currentFilter.persistenceFromDate}
                                ></lightning-input>
                            </div>
                            <div class="slds-size_1-of-2 slds-var-p-horizontal_xx-small">
                                <lightning-input
                                    type="date"
                                    label="To"
                                    name="persistenceToDate"
                                    onchange={changeField}
                                    value={currentFilter.persistenceToDate}
                                ></lightning-input>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </template>
    </div>
    <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-top_small">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-button label="Clear Filters" title="Clear Filters" onclick={clearFilters}></lightning-button>
            <lightning-button
                variant="brand"
                label="Apply Filters"
                title="Apply Filters"
                onclick={applyFilters}
                class="slds-var-m-left_xx-small"
            ></lightning-button>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-body_small">
            <div class="slds-text-align_right slds-show_medium">† Uses full name (preferred or legal)</div>
            <div class="slds-var-m-top_xx-small slds-hide_medium">† Uses full name (preferred or legal)</div>
        </div>
    </div>
</template>
