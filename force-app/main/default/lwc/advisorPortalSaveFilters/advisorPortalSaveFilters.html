<template>
    <lightning-button
        variant="brand"
        label="Save Filters"
        title="Save Filters"
        onclick={openSaveModal}
        class="slds-var-m-right_xx-small"
    ></lightning-button>
    <lightning-button
        variant="neutral"
        label="Reset Saved Filters"
        title="Reset Saved Filters"
        onclick={openResetModal}
    ></lightning-button>

    <c-lightning-question-answer-modal
        class="save-modal"
        title="Save Filters?"
        questions={saveQuestions}
        buttons={saveButtons}
    ></c-lightning-question-answer-modal>
    <c-lightning-question-answer-modal
        class="reset-modal"
        title="Delete Saved Filters?"
        questions={resetQuestions}
        buttons={resetButtons}
    ></c-lightning-question-answer-modal>
</template>
