<template>
    <div class="slds-var-m-bottom_medium">
        <div>
            <c-lightning-combo-box
                label="Search"
                options={userAndPodOptions}
                value={ownerIds}
                multi-select="true"
                searchable="true"
                spinner-active={isLoading}
                placeholder={placeholder}
                oncommit={changeHandler}
            ></c-lightning-combo-box>
        </div>
        <template if:true={hasPills}>
            <div class="slds-listbox_selection-group unset-height">
                <div class="slds-listbox-toggle">
                    <template if:true={showPillToggle}>
                        <a role="button" onclick={togglePillExpansion} aria-label="toggle pills">
                            <template lwc:if={showAllPills}> Collapse Pills </template>
                            <template lwc:else> +{unshownPillCount} more </template>
                        </a>
                    </template>
                </div>
                <div class="slds-listbox slds-listbox_horizontal">
                    <lightning-pill-container
                        items={shownPills}
                        onitemremove={removeHandler}
                    ></lightning-pill-container>
                </div>
            </div>
        </template>
    </div>
    <div>
        <lightning-button label="Select All" title="Select All" onclick={selectAll}></lightning-button>
        <lightning-button
            label="My Queue"
            title="My Queue"
            onclick={selectMyQueue}
            class="slds-var-m-left_xx-small"
        ></lightning-button>
        <lightning-button
            label="Clear Selection"
            title="Clear Selection"
            onclick={clearSelection}
            class="slds-var-m-left_xx-small"
        ></lightning-button>
        <lightning-button
            label="Apply Selected Users"
            variant="brand"
            title="Apply"
            onclick={applyChanges}
            class="slds-var-m-left_xx-small"
        ></lightning-button>
    </div>
</template>
