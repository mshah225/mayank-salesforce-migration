<template>
    <div class="slds-var-m-bottom_medium">
        <div class="slds-combobox_container slds-has-selection">
            <div
                class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
                aria-expanded="false"
                aria-haspopup="listbox"
                role="combobox"
                aria-label="Advising Committees"
                aria-controls="topLevelDropdown"
                onfocusout={clickedOutOfModal}
                onfocusin={clickedInModal}
            >
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
                    <span class="slds-icon slds-input__icon slds-input__icon_left slds-icon-text-default">
                        <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                    </span>
                    <lightning-input
                        label="Committee Options"
                        type="text"
                        class="slds-combobox__input slds-size_1-of-1"
                        placeholder={placeholder}
                        onclick={toggleDropdown}
                        onchange={onChangeNameSearch}
                        variant="label-hidden"
                    >
                    </lightning-input>
                    <span class="slds-icon slds-input__icon slds-input__icon_right slds-icon-text-default">
                        <lightning-icon icon-name="utility:chevrondown" size="x-small"></lightning-icon>
                    </span>
                </div>
                <div
                    class="slds-dropdown slds-dropdown_length-7 slds-dropdown_fluid"
                    role="listbox"
                    aria-label="Committee Options"
                    aria-selected="false"
                >
                    <ul class="slds-listbox slds-listbox_vertical" role="group" aria-label="Committee Options List">
                        <template if:false={noSearchResults}>
                            <template for:each={filterResults} for:item="opt">
                                <li role="presentation" class="slds-listbox__item" key={opt.key}>
                                    <template if:true={opt.isHeader}>
                                        <div
                                            class="
                                                slds-media
                                                slds-listbox__option slds-listbox__option_plain
                                                slds-media_small
                                            "
                                            role="presentation"
                                        >
                                            <h3 class="slds-listbox__option-header" role="presentation">{opt.label}</h3>
                                        </div>
                                    </template>
                                    <template if:false={opt.isHeader}>
                                        <c-advisor-portal-top-level-filter-option
                                            option={opt}
                                            ontoggleoption={toggleOption}
                                            tabindex="0"
                                        ></c-advisor-portal-top-level-filter-option>
                                    </template>
                                </li>
                            </template>
                        </template>
                        <template if:true={noSearchResults}> No results found. </template>
                    </ul>
                </div>
            </div>
        </div>
        <!--Begin Pill Display-->
        <template if:true={hasSelectedSomeOptions}>
            <div class="slds-listbox_selection-group">
                <div class="slds-listbox-toggle">
                    <template if:true={showPillToggle}>
                        <a role="button" onclick={togglePillGroup} aria-label="expand pill group">{pillButtonLabel}</a>
                    </template>
                </div>
                <div class="slds-listbox slds-listbox_horizontal ul-listbox">
                    <lightning-pill-container
                        items={shownPills}
                        onitemremove={unselectByPill}
                    ></lightning-pill-container>
                </div>
            </div>
        </template>
    </div>
    <div>
        <lightning-button label="Select All" title="Select All" onclick={selectAll}></lightning-button>
        <lightning-button
            label="My Queue"
            title="My Queue"
            onclick={selectMyQueue}
            class="slds-var-m-left_xx-small"
        ></lightning-button>
        <lightning-button
            label="Clear Selection"
            title="Clear Selection"
            onclick={clearSelection}
            class="slds-var-m-left_xx-small"
        ></lightning-button>
        <lightning-button
            label="Apply Selected Users"
            variant="brand"
            title="Apply"
            onclick={applyChanges}
            class="slds-var-m-left_xx-small"
        ></lightning-button>
    </div>
</template>
