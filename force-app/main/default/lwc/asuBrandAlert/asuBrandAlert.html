<template>
    <div class="alert alert-warning" role="alert">
        <div class="alert-icon">
            <span title="Alert" class="fa fa-icon fa-bell"></span>
        </div>
        <div class="alert-content">
            Have a Financial Aid question? Before you contact us, get quick answers to the&nbsp;
            <a href="https://students.asu.edu/contact/financialaid" target="_blank"
                >most common questions students are asking right now</a
            >
            .
        </div>
        <div class="alert-close">
            <button
                type="button"
                class="btn btn-circle btn-circle-alt-black close"
                aria-label="Close"
                onclick={handleOnclick}
            >
                <i class="fa fa-times"></i>
            </button>
        </div>
    </div>
</template>
