<!-- sldsValidatorIgnore -->
<template>
    <div class="alert-list">
        <template for:each={alertList} for:item="alert">
            <div key={alert.id} class={alert.classList} role={alert.aria.alertRole} data-key={alert.id}>
                <div class="alert-icon">
                    <i title={alert.iconTitle} aria-label={alert.aria.iconDescription} class={alert.icon}></i>
                </div>
                <div class="alert-content">
                    <strong aria-describedby={alert.aria.id.message}> {alert.title} </strong>
                    <span id={alert.aria.id.message}>
                        {alert.message}
                        <template if:true={alert.linkNotNull}>
                            &nbsp;
                            <a
                                href={alert.link}
                                target="_blank"
                                aria-description="For more information, follow this external link"
                                ><i class="fa fa-icon fa-external-link"></i>
                            </a>
                        </template>
                    </span>
                </div>
                <div class="alert-close">
                    <button
                        type="button"
                        class="btn btn-circle btn-circle-alt-white close"
                        aria-label="Close alert"
                        onclick={closeAlert}
                    >
                        <i class="fa fa-times"></i>
                    </button>
                </div>
            </div>
        </template>
    </div>
</template>
