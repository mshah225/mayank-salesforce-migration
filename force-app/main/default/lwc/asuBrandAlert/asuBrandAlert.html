<!-- sldsValidatorIgnore -->
<template>
    <div class="alert-list">
        <template for:each={alertList} for:item="alert">
            <div key={alert.id} class={alert.classList} role={alert.aria.alertRole} data-key={alert.id}>
                <div class="alert-icon slds-scope">
                    <lightning-icon
                        icon-name={alert.icon}
                        alternative-text={alert.aria.iconDescription}
                        title={alert.iconTitle}
                    >
                    </lightning-icon>
                </div>
                <div class="alert-content">
                    <strong aria-describedby={alert.aria.id.message}> {alert.title} </strong>
                    <span id={alert.aria.id.message}>
                        {alert.message}
                        <template if:true={alert.linkNotNull}>
                            &nbsp;
                            <a href={alert.link} target="_blank" class="slds-scope alert-link">
                                <lightning-icon
                                    icon-name="utility:new_window"
                                    size="x-small"
                                    alternative-text="For more information, follow this external link"
                                    title="For more information, follow this external link"
                                >
                                </lightning-icon>
                            </a>
                        </template>
                    </span>
                </div>
                <div class="alert-close slds-scope">
                    <button
                        class="btn btn-circle btn-circle-alt-white close"
                        aria-label="Close alert"
                        onclick={closeAlert}
                    >
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="close" title="close">
                        </lightning-icon>
                    </button>
                </div>
            </div>
        </template>
    </div>
</template>
