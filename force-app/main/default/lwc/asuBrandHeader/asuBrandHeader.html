<template>
    <div class={wrapperClasses}>
        <div lwc:ref="attachRoot" class="attachRoot" lwc:dom="manual"></div>
        <template if:true={viewingAs}>
            <div class="view-as-container">
                <div class="view-as">
                    <div class="font-weight-bold">{viewAsFirstName} {viewAsLastName} ({viewAsEmplId})</div>
                    <div>
                        Page is Read-Only &nbsp;
                        <a class="btn btn-sm bg-light" href={viewAsViewAsUrl}>Change View As</a>
                        &nbsp;
                        <a class="btn btn-sm bg-light" href={viewAsStopViewAsUrl}>Stop View As</a>
                    </div>
                </div>
            </div>
        </template>
        <div class="header-spacer"></div>
    </div>
</template>
