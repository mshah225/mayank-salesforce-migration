<template>
    <lightning-card title="Campus Visit Check-In">
        <div slot="actions">
            <lightning-button label="Mark Late Selected Campaign Members" onclick={updateSelectedCampaignMembers}></lightning-button>
        </div>
        <div class="slds-card__body_inner">

            <div class="slds-grid slds-gutters slds-p-bottom_x-small slds-p-left_x-small">
                <lightning-input type="search" onchange={handleSearch}></lightning-input>
            </div>

            <lightning-datatable
            key-field="id"
            data={contacts}
            columns={cols}
            onrowselection={handleRowSelection}
            onrowaction={handleRowAction}
            > 
            </lightning-datatable>
        </div>

    </lightning-card>
</template>
