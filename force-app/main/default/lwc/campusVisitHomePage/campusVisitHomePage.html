<template>
    <lightning-card title="Campus Visit Check-In">
        <div slot="actions">
            <lightning-button style="margin-right: 10px;" label="Mark Late Selected Campaign Members" onclick={updateSelectedCampaignMembers}></lightning-button>
            <lightning-button style="margin-right: 10px;" label="Walk-In Form" onclick={createCampaignMember}></lightning-button>
            <lightning-button style="margin-right: 10px;" label="Split into Tour Groups" onclick={splitIntoTourGroups}></lightning-button>
            <lightning-button label="Refresh Data" onclick={refreshTable}></lightning-button>
        </div>
        <div class="slds-card__body_inner">

            <div class="slds-col">
                <p>
                    Open Capaign Page:
                    <a href="javascript:void(0);" onclick={navigateToCampaignPage}>
                        Here
                    </a>
                </p>
             </div>

            <div class="slds-grid slds-gutters slds-p-bottom_x-small slds-p-left_x-small slds-m-left_x-small">
                <lightning-input type="search" label="Search for a first or last name" onchange={handleSearch}></lightning-input>
            </div>

            <lightning-accordion allow-multiple-sections-open>

                <lightning-accordion-section name="Visitor Status" label="Visitor Status">
                    <lightning-checkbox-group name="Statuses"
                                label="Statuses"
                                options={options}
                                value={value}
                                onchange={handleChange}></lightning-checkbox-group>
                </lightning-accordion-section>
            </lightning-accordion>

            <lightning-datatable
            key-field="id"
            data={contacts}
            columns={cols}
            onrowselection={handleRowSelection}
            onrowaction={handleRowAction}
            > 
            </lightning-datatable>
        </div>

    </lightning-card>
</template>
