<template>
    <c-lightning-error-or-retry message={errorMessage} has-error={hasError} retry-enabled="false">
        <lightning-card>
            <!-- Card Title-->
            <h3 slot="title">
                <lightning-icon icon-name={lwcComponentIconName} size="small"></lightning-icon>
                &nbsp;&nbsp;{lwcComponentName}
            </h3>
            <!-- /Card Title-->

            <!-- Card Body -->
            <div class="slds-p-horizontal_small slds-m-vertical_large">
                <c-lightning-await-load-block loading={loading} has-content="true" icon-size="large">
                    <!-- Edit Form -->
                    <lightning-record-edit-form
                        record-id={recordId}
                        object-api-name="Case"
                        onsubmit={handleOnEditFormSubmit}
                        onerror={handleOnEditFormError}
                        onsuccess={handleOnEditFormSuccess}
                    >
                        <!-- Validation Error -->
                        <template lwc:if={hasValidationError}>
                            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                <span class="slds-assistive-text">error</span>
                                <h2>
                                    {validationError.message}
                                    <template lwc:if={validationError.detail}><br />{validationError.detail}</template>
                                </h2>
                            </div>
                        </template>
                        <!-- /Validation Error -->
                        <!-- Category-->
                        <lightning-combobox
                            name="CC_Category__c"
                            label="Category"
                            value={selectedCategory}
                            placeholder="Select a Category"
                            options={categoryOptions}
                            onchange={handleCategoryChange}
                            disabled={categoryDisabled}
                        ></lightning-combobox>
                        <!-- /Category-->
                        <!--Sub Category-->
                        <lightning-combobox
                            name="CC_Sub_Category__c"
                            label="Sub Category"
                            value={selectedSubCategory}
                            placeholder="Select a Sub Category"
                            options={subCategoryOptions}
                            onchange={handleSubCategoryChange}
                            disabled={subCategoryDisabled}
                        ></lightning-combobox>
                        <!-- /Sub Category-->

                        <!-- Action Buttons -->
                        <div class="slds-align_absolute-center slds-m-top_medium">
                            <lightning-button
                                label={lwcRecordSubmitButtonLabel}
                                type="submit"
                                variant={lwcRecordSubmitButtonVariant}
                            ></lightning-button>
                        </div>
                        <!-- /Action Buttons -->
                    </lightning-record-edit-form>
                    <!-- /Edit Form -->
                </c-lightning-await-load-block>
            </div>
            <!-- /Card Body -->
        </lightning-card>
    </c-lightning-error-or-retry>
</template>
