<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="standard:case" size="small"></lightning-icon>
            &nbsp;&nbsp;{lwcComponentName}
        </h3>

        <p class="slds-p-horizontal_small">
            <c-lightning-error-or-retry message={errorMessage} retry-enabled="false" has-error={hasError}>
                <!-- Case Close Button -->
                <template lwc:if={buttonVisible}>
                    <lightning-button
                        variant={lwcCloseButtonVariant}
                        label={lwcCloseButtonLabel}
                        onclick={handleOnCaseCloseButton}
                        disabled={loading}
                    ></lightning-button>
                </template>

                <!-- Case Close Spam Button -->
                <template lwc:if={spamButtonVisible}>
                    &nbsp;&nbsp;
                    <lightning-button
                        variant={lwcCloseSpamButtonVariant}
                        label={lwcCloseSpamButtonLabel}
                        onclick={handleCloseSpam}
                        disabled={loading}
                    ></lightning-button>
                </template>

                <!-- Loading -->
                <template lwc:if={loading}>
                    <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
                </template>

                <!-- On Form Visible -->
                <template lwc:if={formVisible}>
                    <!-- Record Edit Form -->
                    <c-lightning-case-close-view
                        lwc:ref="caseCloseView"
                        case-ids={recordIdList}
                        onerror={errorHandler}
                        onstatus={statusHandler}
                        onready={handleFormReady}
                    ></c-lightning-case-close-view>

                    <!-- Action Buttons -->
                    <template lwc:if={formReady}>
                        <div class="slds-align_absolute-center" if:true={formVisible}>
                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                disabled={isSubmitting}
                                onclick={handleOnCancel}
                            ></lightning-button
                            >&nbsp;
                            <lightning-button
                                label={lwcRecordSubmitButtonLabel}
                                variant={lwcRecordSubmitButtonVariant}
                                disabled={isSubmitting}
                                onclick={handleOnSubmit}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
            </c-lightning-error-or-retry>
        </p>
    </lightning-card>
</template>
