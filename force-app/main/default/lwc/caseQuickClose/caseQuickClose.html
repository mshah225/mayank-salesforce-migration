<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="standard:case" size="small"></lightning-icon>
            &nbsp;&nbsp;{lwcComponentName}
        </h3>

        <p class="slds-p-horizontal_small">
            <template lwc:if={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>
                        {errorMessage}
                        <br />
                        Contact Salesforce Support:
                        <lightning-formatted-email value={errorContactEmail} hide-icon></lightning-formatted-email>
                    </h2>
                </div>
            </template>
            <template lwc:else>
                <!-- Case Close Button -->
                <template lwc:if={isButtonVisible}>
                    <lightning-button
                        variant={lwcCloseButtonVariant}
                        label={lwcCloseButtonLabel}
                        onclick={handleOnCaseCloseButton}
                        disabled={loading}
                    ></lightning-button>
                </template>

                <!-- Case Close Spam Button -->
                <template lwc:if={isSpamButtonVisible}>
                    &nbsp;&nbsp;
                    <lightning-button
                        variant={lwcCloseSpamButtonVariant}
                        label={lwcCloseSpamButtonLabel}
                        onclick={handleOnCaseCloseSpamButton}
                        disabled={loading}
                    ></lightning-button>
                </template>

                <!-- Loading -->
                <template lwc:if={loading}>
                    <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
                </template>

                <!-- On Form Visible -->
                <template lwc:if={formVisible}>
                    <!-- Record Edit Form -->
                    <c-lightning-case-close-view
                        lwc:ref="caseCloseView"
                        case-ids={recordIdList}
                        mass-operation="false"
                        show-toasts="true"
                        onerror={errorHandler}
                        onstatus={statusHandler}
                        onready={handleFormReady}
                    ></c-lightning-case-close-view>

                    <!-- Action Buttons -->
                    <template lwc:if={formReady}>
                        <div class="slds-align_absolute-center" if:true={formVisible}>
                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                disabled={isSubmitting}
                                onclick={handleOnCancel}
                            ></lightning-button
                            >&nbsp;
                            <lightning-button
                                label={lwcRecordSubmitButtonLabel}
                                variant={lwcRecordSubmitButtonVariant}
                                disabled={isSubmitting}
                                onclick={handleOnSubmit}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
            </template>
        </p>
    </lightning-card>
</template>
