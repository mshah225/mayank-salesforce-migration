<template>
    <div onclick={openModal} role="button" aria-label="Provide Feedback" class="openButton">
        <lightning-icon
            icon-name="utility:anywhere_chat"
            alternative-text="Provide Feedback"
            variant="inverse"
            size={iconSize}
        ></lightning-icon>
        <span>Feedback</span>
    </div>

    <c-lightning-design-toast></c-lightning-design-toast>

    <template if:true={loading}>
        <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
    </template>

    <section role="dialog" tabindex="-1" aria-modal={notHideModal} class="slds-modal" aria-hidden={hideModal}>
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <lightning-button-icon
                    icon-name="utility:close"
                    variant="bare-inverse"
                    alternative-text="Close"
                    size="large"
                    title="Close"
                    onclick={closeModal}
                    class="slds-modal__close"
                ></lightning-button-icon>
                <h2 class="slds-text-body_regular"><label>Feedback</label></h2>
            </header>
            <div class="slds-modal__content slds-var-p-around_medium">
                <h3 class="slds-text-body_regular">{title}</h3>
                <lightning-textarea label="Feedback Comments"></lightning-textarea>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button
                    variant="neutral"
                    label="Cancel"
                    title="Cancel"
                    onclick={closeModal}
                    class="slds-var-m-left_x-small"
                ></lightning-button>
                <lightning-button
                    variant="brand"
                    type="submit"
                    label="Submit"
                    title="Submit"
                    onclick={sendFeedback}
                    class="slds-var-m-left_x-small"
                ></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop"></div>
</template>
