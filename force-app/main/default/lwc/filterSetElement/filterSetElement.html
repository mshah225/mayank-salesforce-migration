<template>
    <div class="slds-grid">
        <div class="slds-col">
            <span class="slds-text-heading_medium vert-align">
                <template lwc:if={renameMode}>
                    <lightning-input
                        variant="label-hidden"
                        value={newName}
                        onchange={changeFilterName}
                        onkeydown={changeFilterNameKeydown}
                        class="edit-name-input"
                        lwc:ref="editNameInput"
                    ></lightning-input>
                </template>
                <template lwc:else> {filterName} </template>
            </span>

            <lightning-button-icon
                icon-name="utility:edit"
                variant="bare"
                alternative-text="Edit filter set name"
                class="slds-m-left_x-small slds-m-right_large"
                title="Edit filter set name"
                onclick={handleRename}
            ></lightning-button-icon>

            <span class="vert-align">{shareType}</span>
            <span class="vert-align slds-m-horizontal_xx-small">&middot;</span>
            <span class="vert-align slds-m-right_large">{ownerName}</span>

            <span class="vert-align slds-text-color_weak">
                (<lightning-formatted-date-time value={createdDate}></lightning-formatted-date-time>)
            </span>
        </div>
        <div class="slds-col slds-grow-none">
            <c-lightning-button-dropdown
                label="Apply filter set"
                onclick={applyFilterSet}
                onselect={handleSelect}
                dynamic-dropdown="true"
            >
                <c-lightning-button-dropdown-item
                    label={pinLabel}
                    icon-name="utility:pin"
                    name="pin"
                ></c-lightning-button-dropdown-item>
                <c-lightning-button-dropdown-item
                    label="Share"
                    icon-name="utility:share"
                    name="share"
                ></c-lightning-button-dropdown-item>
                <c-lightning-button-dropdown-item
                    label="View"
                    icon-name="utility:preview"
                    name="view"
                ></c-lightning-button-dropdown-item>
                <c-lightning-button-dropdown-item
                    label="Remove"
                    icon-name="utility:delete"
                    name="remove"
                ></c-lightning-button-dropdown-item>
            </c-lightning-button-dropdown>
        </div>
    </div>
</template>
