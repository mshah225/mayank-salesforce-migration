<template>
    <template for:each={questions} for:item="q">
        <div key={q.key}>
            <template if:true={q.isTextArea}>
                <template if:true={q.required}>
                    <lightning-textarea
                        name={q.key}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                        required
                    ></lightning-textarea>
                </template>
                <template if:false={q.required}>
                    <lightning-textarea
                        name={q.key}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                    ></lightning-textarea>
                </template>
            </template>
            <template if:false={q.isTextArea}>
                <template if:true={q.required}>
                    <lightning-input
                        name={q.key}
                        type={q.type}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                        required
                    ></lightning-input
                ></template>
                <template if:false={q.required}>
                    <lightning-input
                        name={q.key}
                        type={q.type}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                    ></lightning-input
                ></template>
            </template>
            <template if:true={q.hasSubnote}>
                <p class="slds-text-body_regular slds-text-color_weak">{q.subnote}</p>
            </template>
        </div>
    </template>
</template>
