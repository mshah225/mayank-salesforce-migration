<template>
    <h1>{title}</h1>
    <template if:true={showAlert}>
        <div class="alert-wrapper">
            {alert} <br />
            <template if:true={showAlertLink}>
                <a target="_blank" href={alertHref}>{alertHref}</a>
            </template>
        </div>
    </template>
    <c-lightning-question-answer-section
        questions={configurableQuestions}
        onchange={changeAnswers}
    ></c-lightning-question-answer-section>
    <lightning-button
        variant="brand"
        label="Submit"
        title="Submit"
        onclick={submit}
        class="slds-var-m-left_x-small"
        disabled={disabledButton}
    ></lightning-button>
</template>
