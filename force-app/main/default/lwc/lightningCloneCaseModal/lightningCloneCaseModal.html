<template>
    <lightning-quick-action-panel header="Clone Case" style="overflow-y: hidden">
        <div class="slds-p-bottom_large slds-p-left_large slds-is-relative" style="max-length: 600px;">
            <!-- Form loader -->
            <template lwc:if={loading}>
                <br />
                <br />
                <lightning-spinner variant="brand" alternative-text="Loading..." size="medium"></lightning-spinner>
                <br />
                <br />
            </template>

            <!-- Clone case form -->
            <template lwc:else>
                <lightning-record-edit-form
                    object-api-name="Case"
                    density="comfy"
                    onsuccess={handleSuccess}
                    onload={handleLoad}
                >
                    <lightning-input-field field-name="ContactId" value={getContact}></lightning-input-field>

                    <lightning-input-field
                        field-name="CC_Functional_Group__c"
                        value={getFunctionalGroup}
                        class="slds-hidden"
                        style="display: none"
                    ></lightning-input-field>

                    <lightning-input-field
                        field-name="CC_Category__c"
                        value={getCategory}
                        class="slds-hidden"
                        style="display: none"
                    ></lightning-input-field>

                    <lightning-input-field
                        field-name="CC_Sub_Category__c"
                        value={getSubCategory}
                        class="slds-hidden"
                        style="display: none"
                    ></lightning-input-field>

                    <lightning-combobox
                        name="CC_Category__c"
                        label="Category"
                        value={getCategory}
                        placeholder="Select Category"
                        options={categoryOptions}
                        onchange={handleCategoryChange}
                        disabled={categoryDisabled}
                        style="width: 99%; margin-left: 4.5px"
                    ></lightning-combobox>
                    <lightning-combobox
                        name="CC_Sub_Category__c"
                        label="Sub Category"
                        value={getSubCategory}
                        placeholder="Select Sub Category"
                        options={subCategoryOptions}
                        onchange={handleSubCategoryChange}
                        disabled={subCategoryDisabled}
                        style="width: 99%; margin-left: 4.5px"
                    ></lightning-combobox>
                    <lightning-input-field field-name="Case_Owner__c" value={getOwner}> </lightning-input-field>
                    <lightning-input-field field-name="Origin__c" value={getOrigin}> </lightning-input-field>
                    <lightning-input-field field-name="Status" value={getStatus}> </lightning-input-field>
                    <lightning-input-field field-name="Subject" value={getSubject}> </lightning-input-field>
                    <lightning-input-field field-name="Description" value={getDescription}> </lightning-input-field>
                    <lightning-input-field field-name="Needs_Attention__c" value={getNeedsAttentionStatus}>
                    </lightning-input-field>
                    <lightning-input-field field-name="Escalated_From__c" value={getEscalationSource}>
                    </lightning-input-field>
                    <lightning-input-field field-name="Processing_Status__c" value={getProcessingStatus}>
                    </lightning-input-field>
                    <lightning-input-field field-name="Opportunity__c" value={getOpportunity}> </lightning-input-field>
                    <lightning-input-field field-name="Case_Source__c" value={getCaseSource}> </lightning-input-field>
                    <lightning-input-field
                        field-name="Initial_Request_Sent_To_Addresses__c"
                        value={getInitialRequestAddress}
                    >
                    </lightning-input-field>

                    <hr
                        style="
                            margin-top: 10px;
                            margin-bottom: 10px;
                            border-top: 2px solid
                                var(--slds-g-color-border-base-1, var(--lwc-colorBorder, rgb(229, 229, 229)));
                            position: relative;
                            left: -40px;
                            width: calc(100% + 60px);
                        "
                    />
                    <div class="slds-float_right">
                        <lightning-button label="Cancel" variant="neutral" onclick={closeModal}></lightning-button
                        >&nbsp;
                        <lightning-button label="Submit" type="submit" variant="brand"></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
