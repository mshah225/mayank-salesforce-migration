<template>
    <div class="slds-form-element">
        <template if:true={label}>
            <template if:true={required}>
                <span style="color: red">*&nbsp;</span>
            </template>
            <label class="slds-form-element__label">{label}</label>
        </template>
        <div class="slds-combobox_container">
            <div
                class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open"
                aria-expanded="true"
                aria-haspopup="listbox"
                role="combobox"
            >
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                    <div class="inputBox slds-form-element" onclick={toggleDropdown}>
                        <label class="slds-form-element__label slds-no-flex slds-assistive-text"></label>
                        <div class="slds-form-element__control slds-grow">
                            <div role="button" class="slds-input slds-combobox__input slds-input_faux">
                                <span class="slds-truncate"><label>{placard}</label></span>
                            </div>
                        </div>
                    </div>
                    <lightning-icon
                        class="slds-input__icon"
                        icon-name="utility:chevrondown"
                        size="x-small"
                        alternative-text="search"
                    ></lightning-icon>
                    <div
                        class="focusCapture"
                        onfocus={handleFocusEvent}
                        onblur={handleBlurEvent}
                        onkeydown={keyboardController}
                        tabindex="0"
                    ></div>
                </div>
                <!-- Dropdown List -->
                <template if:true={showDropdown}>
                    <div
                        class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                        onkeydown={keyboardController}
                    >
                        <ul class="slds-listbox slds-listbox_vertical recordListBox" role="presentation">
                            <template for:each={options} for:item="option">
                                <template if:true={option.isLabel}>
                                    <li key={option.value} role="presentation" class="slds-listbox__item">
                                        <div class="slds-listbox__option_plain slds-listbox__option-header"></div>
                                        <div
                                            class="slds-listbox__option_plain slds-listbox__option-header"
                                            role="presentation"
                                        >
                                            <span class="slds-media__body">
                                                <h3 class="slds-truncate" title={option.label}>{option.label}</h3>
                                            </span>
                                        </div>
                                    </li>
                                </template>
                                <template if:false={option.isLabel}>
                                    <li
                                        key={option.value}
                                        data-id={option.value}
                                        data-index={option.index}
                                        data-hover="0"
                                        onmouseenter={hoverElement}
                                        onmousedown={toggleItem}
                                        class="slds-listbox__item eachItem"
                                    >
                                        <span class="slds-media__figure slds-listbox__option-icon">
                                            <template if:true={option.isSelected}>
                                                <lightning-icon
                                                    icon-name="utility:check"
                                                    size="x-small"
                                                    alternative-text="icon"
                                                ></lightning-icon>
                                            </template>
                                        </span>
                                        <span
                                            class="slds-media slds-listbox__option_entity verticalAlign slds-truncate"
                                        >
                                            {option.label}
                                        </span>
                                    </li>
                                </template>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </div>
        <template if:true={hasError}>
            <div class="slds-form-element__help" role="alert">Complete this field.</div>
        </template>
    </div>
</template>
