<template>
    <div class="slds-form-element">
        <template lwc:if={label}>
            <template if:true={required}>
                <span class="required-flag">*&nbsp;</span>
            </template>
            <label class="slds-form-element__label" for="combobox">{label}</label>
        </template>
        <div class="slds-form-element__control">
            <div class="slds-combobox_container">
                <div class={sldsComboboxClasses} aria-expanded={airaExpanded} aria-haspopup="listbox" role="combobox">
                    <div
                        lwc:ref="primaryInputFormElement"
                        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                        role="none"
                        onmousedown={toggleDropdown}
                        onkeydown={inputKeyDownHandler}
                    >
                        <input
                            lwc:ref="primaryInput"
                            type="text"
                            class="slds-input slds-combobox__input"
                            id="combobox"
                            aria-controls="slds-dropdown"
                            aria-disabled={ariaDisabled}
                            role="textbox"
                            placeholder={placard}
                            oninput={filterDropdown}
                            value={searchText}
                            tabindex={inputTabIndex}
                        />
                        <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                            <template lwc:if={spinnerActive}>
                                <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
                            </template>
                            <template lwc:else>
                                <lightning-icon icon-name={dropdownIconName} size="x-small"></lightning-icon>
                            </template>
                        </span>
                    </div>
                    <div lwc:ref="attachRef" lwc:dom="manual"></div>
                    <div id="slds-dropdown" class={sldsDropdownClasses} role="listbox" tabindex="-1">
                        <ul lwc:ref="list" class="slds-listbox slds-listbox_vertical">
                            <template for:each={shownDropdownOptions} for:item="opt">
                                <template lwc:if={opt.isHeader}>
                                    <li key={opt.value} role="presentation" class="slds-listbox__item">
                                        <div
                                            class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                            role="presentation"
                                        >
                                            <h3 class="slds-listbox__option-header" role="presentation">{opt.label}</h3>
                                        </div>
                                    </li>
                                </template>
                                <template lwc:else>
                                    <li
                                        key={opt.value}
                                        role="presentation"
                                        class="slds-listbox__item"
                                        onclick={toggleOption}
                                        onkeydown={listKeyDownHandler}
                                        data-key={opt.value}
                                        tabindex="0"
                                    >
                                        <div
                                            class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                            role="option"
                                        >
                                            <span class="slds-media__figure slds-listbox__option-icon">
                                                <template lwc:if={opt.isSelected}>
                                                    <lightning-icon
                                                        icon-name="utility:check"
                                                        size="x-small"
                                                    ></lightning-icon>
                                                </template>
                                            </span>
                                            <span class="slds-media__body">
                                                <span class="slds-truncate" title={opt.label}>{opt.label}</span>
                                            </span>
                                        </div>
                                    </li>
                                </template>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <template if:true={hasError}>
            <div class="slds-form-element__help slds-text-color_error" role="alert">Complete this field.</div>
        </template>
    </div>
</template>
