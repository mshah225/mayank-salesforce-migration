<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label" for="combobox-id-1" id="combobox-label">
            <template if:true={required}>
                <span style="color: red">*&nbsp;</span>
            </template>
            {label}
        </label>
        <div class="slds-form-element__control">
            <div class="slds-combobox_container">
                <div
                    class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
                    onfocusout={focusOutOfDropdown}
                    onfocusin={focusInDropdown}
                    tabindex="0"
                    onkeydown={toggleDropdownKeyboard}
                >
                    <div
                        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                        role="none"
                        onclick={toggleDropdown}
                    >
                        <div
                            role="button"
                            class="slds-input slds-combobox__input"
                            aria-labelledby="combobox-label"
                            aria-controls="listbox-id"
                            aria-expanded={shownStr}
                            aria-haspopup="listbox"
                        >
                            <span class="slds-truncate" id="combobox-value-id-102"><label>{placard}</label></span>
                        </div>
                        <span
                            class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right"
                        >
                            <lightning-icon
                                icon-name="utility:chevrondown"
                                alternative-text="Toggle"
                                size="x-small"
                                title="Toggle"
                                class="slds-icon"
                            ></lightning-icon>
                        </span>
                    </div>
                    <div
                        id="listbox-id"
                        class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                        role="listbox"
                    >
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template if:true={hasOptions} for:each={_options} for:item="option">
                                <div key={option.value}>
                                    <template if:true={option.isLabel}>
                                        <li role="presentation" class="slds-listbox__item">
                                            <div class="slds-listbox__option_plain slds-listbox__option-header"></div>
                                        </li>
                                        <li role="presentation" class="slds-listbox__item">
                                            <div
                                                class="slds-listbox__option_plain slds-listbox__option-header"
                                                role="presentation"
                                            >
                                                <span class="slds-media__body">
                                                    <h3 class="slds-truncate" title={option.label}>{option.label}</h3>
                                                </span>
                                            </div>
                                        </li>
                                    </template>
                                    <template if:false={option.isLabel}>
                                        <li
                                            role="presentation"
                                            class="slds-listbox__item"
                                            data-value={option.value}
                                            onclick={toggleOption}
                                            tabindex="0"
                                            onkeydown={toggleOptionKeyboard}
                                        >
                                            <div
                                                class="
                                                    slds-media
                                                    slds-listbox__option slds-listbox__option_plain
                                                    slds-media_small
                                                "
                                                role="option"
                                            >
                                                <span class="slds-media__figure slds-listbox__option-icon">
                                                    <template if:true={option.isSelected}>
                                                        <span
                                                            class="
                                                                slds-icon_container
                                                                slds-icon-utility-check slds-current-color
                                                            "
                                                        >
                                                            <lightning-icon
                                                                class="icn slds-icon-text-default"
                                                                icon-name="utility:check"
                                                                size="x-small"
                                                            ></lightning-icon>
                                                        </span>
                                                    </template>
                                                </span>
                                                <span class="slds-media__body">
                                                    <span class="slds-truncate" title={option.label}>
                                                        {option.label}
                                                    </span>
                                                </span>
                                            </div>
                                        </li>
                                    </template>
                                </div>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <template if:true={hasError}>
            <div class="slds-form-element__help" role="alert">Complete this field.</div>
        </template>
    </div>
</template>
