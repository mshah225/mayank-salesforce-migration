<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label" for="combobox-id-1" id="combobox-label">{_label}</label>
        <div class="slds-form-element__control">
            <div class="slds-combobox_container focusWrapper" onblur={closeDropdown} tabindex="0">
                <div class={comboboxClasses}>
                    <div
                        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                        role="none"
                        onclick={toggleDropdown}
                    >
                        <div
                            role="button"
                            class="slds-input_faux slds-combobox__input"
                            aria-labelledby="combobox-label"
                            aria-controls="listbox-id"
                            aria-expanded={shown}
                            aria-haspopup="listbox"
                        >
                            <span class="slds-truncate" id="combobox-value-id-102"><label>{shownPlacard}</label></span>
                        </div>
                        <span
                            class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right"
                        >
                            <lightning-icon
                                icon-name="utility:chevrondown"
                                alternative-text="Toggle"
                                size="x-small"
                                title="Toggle"
                                class="slds-icon"
                            ></lightning-icon>
                        </span>
                    </div>
                    <div
                        id="listbox-id"
                        class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                        role="listbox"
                    >
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template if:true={hasOptions} for:each={_options} for:item="option">
                                <li
                                    key={option.value}
                                    role="presentation"
                                    class="slds-listbox__item"
                                    data-value={option.value}
                                    onclick={toggleOption}
                                >
                                    <div
                                        class="
                                            slds-media
                                            slds-listbox__option slds-listbox__option_plain
                                            slds-media_small
                                        "
                                        role="option"
                                    >
                                        <span class="slds-media__figure slds-listbox__option-icon">
                                            <template if:true={option.isSelected}>
                                                <span
                                                    class="
                                                        slds-icon_container
                                                        slds-icon-utility-check slds-current-color
                                                    "
                                                >
                                                    <lightning-icon
                                                        class="icn slds-icon-text-default"
                                                        icon-name="utility:check"
                                                        size="x-small"
                                                    ></lightning-icon>
                                                </span>
                                            </template>
                                        </span>
                                        <span class="slds-media__body">
                                            <span class="slds-truncate" title={option.label}> {option.label} </span>
                                        </span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
