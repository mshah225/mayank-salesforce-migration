<template>
    <div class={_wrapperClassListStr} data-testid="wrapper-div">
        <template if:false={_loadingToast}>
            <div class={_classList} role="status">
                <span class="slds-assistive-text" data-testid="variant-assistive-label">{_variant}</span>
                <span class="slds-var-m-right_small slds-no-flex slds-align-top">
                    <lightning-icon
                        icon-name={_icon}
                        variant="inverse"
                        alternative-text={_variant}
                        size="large"
                        title={_variant}
                        data-testid="variant-icon"
                    ></lightning-icon>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small"><label data-testid="title-text">{_title}</label></h2>
                    <p data-testid="body-text">{_body}</p>
                </div>
                <div class="slds-notify__close">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Close"
                        size="large"
                        title="Close"
                        onclick={closeToast}
                        data-testid="close-button"
                    ></lightning-button-icon>
                </div>
            </div>
        </template>
        <template if:true={_loadingToast}>
            <div class="slds-notify slds-notify_toast slds-theme_info yes-clicks" role="status">
                <span class="slds-assistive-text" data-testid="variant-assistive-label">loading</span>
                <span class="slds-var-m-right_small slds-no-flex slds-align-top">
                    <div class="loadingSpinnerWrapper">
                        <lightning-spinner
                            alternative-text="Loading"
                            variant="inverse"
                            size="medium"
                            data-testid="variant-icon"
                        ></lightning-spinner>
                    </div>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small"><label data-testid="title-text">Loading...</label></h2>
                </div>
                <div class="slds-notify__close">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Close"
                        size="large"
                        title="Close"
                        onclick={closeToast}
                        data-testid="close-button"
                    ></lightning-button-icon>
                </div>
            </div>
        </template>
    </div>
</template>
