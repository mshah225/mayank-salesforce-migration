<template>
    <lightning-modal-header label={title}></lightning-modal-header>
    <lightning-modal-body>
        <c-lightning-question-answer-section
            questions={questions}
            onchange={changeAnswer}
            onkeydown={killTabKeyPressEvent}
        ></c-lightning-question-answer-section>
    </lightning-modal-body>
    <lightning-modal-footer>
        <template if:true={buttonDescription.cancelButtonLabel}>
            <lightning-button
                label={buttonDescription.cancelButtonLabel}
                variant="neutral"
                onclick={handleCancel}
            ></lightning-button>
        </template>
        <template if:true={buttonDescription.okButtonLabel}>
            <lightning-button
                label={buttonDescription.okButtonLabel}
                variant="brand"
                onclick={handleOkay}
                disabled={isSubmitting}
            ></lightning-button>
        </template>
    </lightning-modal-footer>
</template>
