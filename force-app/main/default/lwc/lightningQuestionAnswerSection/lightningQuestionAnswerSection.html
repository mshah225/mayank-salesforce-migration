<template>
    <template for:each={questions} for:item="q">
        <div key={q.key} data-testid="question">
            <template if:true={q.isLabel}>
                <template if:true={q.isBoldLabel}>
                    <b data-testid="body">{q.question}</b>
                </template>
                <template if:true={q.isPlainLabel}>
                    <span data-testid="body">{q.question}</span>
                </template>
                <template if:true={q.isCenterLabel}>
                    <div class="slds-text-align_center" data-testid="body">{q.question}</div>
                </template>
                <template if:true={q.isLink}>
                    <a target="_blank" href={q.href} data-testid="body">{q.question}</a>
                </template>
            </template>
            <template if:true={q.isSpacer}>
                <div class={q.subtype}></div>
            </template>
            <template if:true={q.isTextArea}>
                <template if:true={q.required}>
                    <lightning-textarea
                        name={q.key}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                        required
                        data-testid="body"
                    ></lightning-textarea>
                </template>
                <template if:false={q.required}>
                    <lightning-textarea
                        name={q.key}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                        data-testid="body"
                    ></lightning-textarea>
                </template>
            </template>
            <template if:true={q.isComboBox}>
                <template if:true={q.required}>
                    <c-lightning-combo-box
                        name={q.key}
                        label={q.question}
                        options={q.options}
                        value={q.answer}
                        onchange={changeAnswer}
                        multi-select={q.isMultiSelect}
                        required
                        data-testid="body"
                    ></c-lightning-combo-box>
                </template>
                <template if:false={q.required}>
                    <c-lightning-combo-box
                        name={q.key}
                        label={q.question}
                        options={q.options}
                        value={q.answer}
                        onchange={changeAnswer}
                        multi-select={q.isMultiSelect}
                        data-testid="body"
                    ></c-lightning-combo-box>
                </template>
            </template>
            <template if:true={q.isDualListbox}>
                <template if:true={q.required}>
                    <lightning-dual-listbox
                        name={q.key}
                        label={q.question}
                        source-label={q.sourceLabel}
                        selected-label={q.selectedLabel}
                        options={q.options}
                        value={q.answer}
                        onchange={changeAnswer}
                        required
                        data-testid="body"
                    ></lightning-dual-listbox>
                </template>
                <template if:false={q.required}>
                    <lightning-dual-listbox
                        name={q.key}
                        label={q.question}
                        source-label={q.sourceLabel}
                        selected-label={q.selectedLabel}
                        options={q.options}
                        value={q.answer}
                        onchange={changeAnswer}
                        data-testid="body"
                    ></lightning-dual-listbox>
                </template>
            </template>
            <template if:true={q.isInput}>
                <template if:true={q.required}>
                    <lightning-input
                        name={q.key}
                        type={q.type}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                        required
                        data-testid="body"
                    ></lightning-input
                ></template>
                <template if:false={q.required}>
                    <lightning-input
                        name={q.key}
                        type={q.type}
                        label={q.question}
                        onchange={changeAnswer}
                        value={q.answer}
                        data-testid="body"
                    ></lightning-input
                ></template>
            </template>
            <template if:true={q.hasSubnote}>
                <p class="slds-text-body_small slds-text-color_weak" data-testid="subnote">{q.subnote}</p>
            </template>
        </div>
    </template>
    <div lwc:dom="manual" class="styleWrapper" data-testid="style-injection"></div>
</template>
