<template>
    <section
        aria-modal={notHideModal}
        aria-hidden={hideModal}
        role="dialog"
        tabindex="-1"
        aria-labelledby="modal-heading"
        aria-describedby="modal-content"
        class="slds-modal"
    >
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <lightning-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    variant="inverse"
                    size="x-small"
                    aria-label="Close"
                    role="button"
                    class="slds-modal__close"
                    onclick={closeModal}
                ></lightning-icon>
                <h2 id="modal-heading" class="slds-modal__title slds-hyphenate"><label>{title}</label></h2>
            </header>
            <div class="slds-modal__content slds-var-p-around_medium slds-text-align_center" id="modal-content">
                {description}
            </div>
            <footer class="slds-modal__footer">
                <template for:each={buttons} for:item="button">
                    <button key={button.label} class={button.classes} onclick={button.callback}>{button.label}</button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop"></div>
</template>
