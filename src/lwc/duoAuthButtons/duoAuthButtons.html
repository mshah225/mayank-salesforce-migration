<!-- Duo Auth Buttons -->
<template>
    <lightning-button-group class="slds-p-right--small">
        <lightning-button disabled={nonAuthenticated} variant="success" label="Authenticated"></lightning-button>
        <lightning-button disabled={authenticated} variant="destructive" label="Non-Authenticated"></lightning-button>
    </lightning-button-group>
    <lightning-button disabled={authenticated} onclick={push} variant="brand" label="DUO"></lightning-button>
</template>
