<template>
    <div onclick={openModal} role='button' aria-label='Provide Feedback' class='openButton'>
        <lightning-icon icon-name='utility:anywhere_chat' alternative-text='Provide Feedback' variant='inverse' size={iconSize} ></lightning-icon>
        <span>Feedback</span>
    </div>
    

    <section role='dialog' tabindex='-1' aria-modal='true' class='slds-modal'>
        <div class='slds-modal__container'>
            <header class="slds-modal__header">
                <lightning-icon icon-name='utility:close' alternative-text='Close' variant='inverse' size='x-small' aria-label='Close' role='button' class='slds-modal__close' onclick={closeModal}></lightning-icon>
                <h2 class='slds-text-heading_medium'>Feedback</h2>
            </header>
            <div class='slds-modal__content slds-p-around_medium'>
                <h3 class='slds-text-small'> ASU values your experience and wants to ensure that you receive quality service. Tell us how we can improve your experience below.</h3>
                <lightning-textarea label="Feedback Comments"></lightning-textarea>
                <template if:true={showError}>
                    <div class='error'>
                        <lightning-icon icon-name='utility:error' alternative-text='Error' variant='inverse' size='x-small'></lightning-icon>
                        <h4>Error</h4> <br/>
                        <span>Feedback must contain some content.</span>
                    </div>
                </template>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-left_x-small"></lightning-button>
                <lightning-button variant="brand" type="submit" label="Send" title="Send" onclick={sendFeedback} class="slds-m-left_x-small"></lightning-button>
            </footer>
        </div>
    </section>
    <div class='slds-backdrop'></div>
</template>
