<template>
    <div role="alert" tabindex="-1" aria-hidden={hide} aria-modal={nothide} class='toastWrapper slds-notify_container slds-is-fixed slds-align_absolute-center fadeOutTransition displayNone'>
        <div role="status" class='toastStatus slds-notify slds-notify_toast slds-is-absolute slds-align-top slds-theme_error'>
            <span class="slds-assistive-text">{variant}</span>
            <span class="slds-icon_container slds-m-right_small slds-no-flex slds-align-top">
                <lightning-icon icon-name={icon} variant='inverse' alternative-text={variant}></lightning-icon>
            </span>
            <div class="slds-notify__content">
                <h2 class="slds-text-heading_small">{title}</h2>
                <p>{body}</p>
            </div>
            <div class="slds-notify__close">
                <lightning-button-icon icon-name="utility:close" variant='bare-inverse' alternative-text="Close" onclick={closeToast}></lightning-button-icon>
            </div>
        </div>
    </div>
</template>
